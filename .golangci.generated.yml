# golangci-lint configuration applied to rb2go's *generated* Go, by the test
# harness (rb2go_test.go copies it next to each transpiled example). It is
# the repo's own linter set minus what cannot apply to a transpiler's output:
# a whole prelude is emitted for every program (`unused`), free functions take
# `self` for uniformity (`unparam`), and identifiers mirror Ruby names
# (`revive` naming). The "Code generated" header would normally skip the file;
# `generated: disable` lints it anyway.

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - misspell
    - errorlint
    - nilerr
    - unconvert
    - gocritic
    - reassign
    - exhaustive
    - whitespace
    - nilnil
    - nilnesserr
    - recvcheck
    - wastedassign
    - nolintlint
    - gochecknoinits
    - intrange
    - copyloopvar
    - mirror
    - perfsprint
    - prealloc
    - gosec

  settings:
    gocritic:
      disabled-checks:
        # `//line` directives have no space after `//` by definition.
        - commentFormatting
        # A narrowed `T?` local is spelled `(*x)`; Go's auto-deref makes the
        # explicit form redundant on method calls but not elsewhere.
        - underef
        # A Ruby block that only forwards (`map { |r| f(r) }`) stays a
        # closure; passing `f` itself is a style choice, not a fix.
        - unlambda
    gosec:
      excludes:
        # Integer width conversions: Ruby integers are unbounded, ours are
        # int; narrowing is by design.
        - G115
        # Every class's Ruby name is a Go string literal (decisions 17/28); gosec's entropy check occasionally flags one as a credential (verified false positive: `Zlib::GzipWriter`'s name literal alone triggers it, reported at an unrelated import line, the //line-confusion below for G103).
        - G101
    staticcheck:
      checks:
        - all
        # The receiver is `self` on purpose: `%x{}` bodies in the prelude
        # bind Ruby's self to it.
        - -ST1006
        # De Morgan rewrites: the generated condition mirrors the Ruby
        # source's structure, which is what keeps `//line` mapping honest.
        - -QF1001

  exclusions:
    generated: disable
    rules:
      # prelude/go/*.go mirrors Ruby-facing names repo-wide (I_ToS, Array_Any, ...); same reason revive naming is off above, but staticcheck only sees it as a real .go path.
      - path: prelude/go/.*\.go
        linters:
          - staticcheck
        text: "(ST1003|ST1021)"
      # gosec ignores the //line remap and reports G103 against main.go's real position, so nolintlint can't correlate its `//nolint:gosec` comment here and calls it unused; the suppression itself still works (verified: gosec shows 0 issues here).
      - path: prelude/go/.*\.go
        linters:
          - nolintlint
