<!doctype html>
<!-- The link-preview card. Regenerate og.png from the repo root: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars --window-size=1200,630 --screenshot=site/og/og.png site/og/card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>rugaroo card</title>
<style>
html, body { margin: 0; }
body {
  width: 1200px; height: 630px; overflow: hidden; display: flex; align-items: center; gap: 64px; padding: 0 88px; box-sizing: border-box;
  color: #f5f0ff; font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  background:
    radial-gradient(2px 2px at 8% 14%, #fff9 50%, transparent 51%),
    radial-gradient(2px 2px at 92% 12%, #fff9 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 66% 82%, #fff7 50%, transparent 51%),
    radial-gradient(2px 2px at 48% 10%, #fff8 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 85% 70%, #fff7 50%, transparent 51%),
    linear-gradient(160deg, #2c2652, #17142b);
}
img { width: 400px; height: 400px; filter: drop-shadow(0 0 60px #fef3c766); flex: none; }
h1 { font-size: 132px; line-height: 1; margin: 0 0 18px; font-weight: 800; letter-spacing: -0.03em; }
.tag { font-size: 48px; color: #fef3c7; margin: 0 0 26px; }
.lede { font-size: 32px; color: #c4bce6; margin: 0 0 30px; line-height: 1.3; }
.url { font-size: 32px; color: #fb7185; font-weight: 700; margin: 0; }
</style>
</head>
<body>
  <img src="../logo.svg" alt="">
  <div>
    <h1>rugaroo</h1>
    <p class="tag">Ruby by day. Go by night.</p>
    <p class="lede">Typed Ruby in, a native binary out.</p>
    <p class="url">rugaroo.dev</p>
  </div>
</body>
</html>
