inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 4.0
  Exclude:
    - gems/**/*
    - vendored/**/*
    - dist/**/*
    - main/**/*
    - .wrangler/**/*
    - node_modules/**/*
    - overrides/brew/work/**/*

# rugaroo reads `#:` and `#[T]` comments in the prelude.
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true

# The repo is double-quoted (Gemfile, prelude).
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# `%x{ ... }` is the prelude's Go-body DSL, not a shell command.
Style/CommandLiteral:
  EnforcedStyle: percent_x
  AllowInnerBackticks: true
Layout/SpaceInsidePercentLiteralDelimiters:
  Enabled: false

# Adding the magic comment makes `s << "x"` raise on MRI, the oracle for every fixture.
Style/FrozenStringLiteralComment:
  Enabled: false

# The prelude's Go text names its parameters (`rbBigAdd(self, o)`), so they cannot be renamed.
Naming/MethodParameterName: &prelude_params
  Exclude:
    - prelude/**/*
    - prelude.rb
Naming/BinaryOperatorParameterName: *prelude_params
Lint/UnusedMethodArgument: *prelude_params
Lint/UnusedBlockArgument: *prelude_params

# Not fixable without rewriting the code; a transpiler's emitters are long by nature.
Metrics:
  Enabled: false
Style/Documentation:
  Enabled: false
Layout/LineLength:
  Enabled: false
