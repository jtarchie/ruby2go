inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 4.0
  Exclude:
    - gems/**/*
    - vendored/**/*
    - dist/**/*
    - main/**/*
    - .wrangler/**/*
    - node_modules/**/*
    - overrides/brew/work/**/*

# rugaroo reads `#:` and `#[T]` comments in the prelude.
Layout/LeadingCommentSpace:
  AllowRBSInlineAnnotation: true

# The repo is double-quoted (Gemfile, prelude).
Style/StringLiterals:
  EnforcedStyle: double_quotes
  Exclude:
    # the shell example's quoting is what it demonstrates
    - examples/73_shell/main.rb
Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# `%x{ ... }` is the prelude's Go-body DSL, not a shell command.
Style/CommandLiteral:
  EnforcedStyle: percent_x
  AllowInnerBackticks: true
Layout/SpaceInsidePercentLiteralDelimiters:
  Enabled: false

# Adding the magic comment makes `s << "x"` raise on MRI, the oracle for every fixture.
Style/FrozenStringLiteralComment:
  Enabled: false

# The prelude's Go text names its parameters (`rbBigAdd(self, o)`), so they cannot be renamed.
Naming/BinaryOperatorParameterName: &prelude_params
  Exclude:
    - prelude/**/*
    - prelude.rb
Lint/UnusedMethodArgument: *prelude_params
Lint/UnusedBlockArgument: *prelude_params

# Not fixable without rewriting the code; a transpiler's emitters are long by nature.
Metrics:
  Enabled: false
Style/Documentation:
  Enabled: false
Layout/LineLength:
  Enabled: false

# Disabled where the autocorrect changes what a fixture or the prelude deliberately exercises.
Lint/DeprecatedClassMethods:
  # stdlib_hardening asserts the deprecated call's behaviour
  Enabled: false
Lint/ToJSON:
  # the fix adds *args to to_json, which rugaroo's signature for it rejects
  Enabled: false
Style/RedundantAssignment:
  # testdata/boot pins the assign-then-return form
  Enabled: false
Style/RedundantRegexpCharacterClass:
  # rxjson inspects the regexp source it wrote
  Enabled: false
Lint/RedundantSplatExpansion:
  # `a[*x, y] = z` calls are what the Array#[]= tests exercise
  Enabled: false
Layout/HeredocIndentation:
  # string tests pin squiggly-heredoc dedent
  Enabled: false
Lint/RedundantRequireStatement:
  # fixtures require libraries explicitly; rugaroo loads libraries on a literal require
  Enabled: false
Lint/UselessAssignment:
  # fixtures assign for the compiler's benefit (dead stores, inference)
  Enabled: false
Naming/RescuedExceptionsVariableName:
  # renames break fixtures that name the rescued variable
  Enabled: false
Style/EmptyLiteral:
  # tests exercise Array.new / Hash.new / String.new themselves
  Enabled: false
Style/ExplicitBlockArgument:
  # tests exercise explicit `yield` forwarding vs &block
  Enabled: false
Lint/LiteralInInterpolation:
  # tests interpolate literals on purpose
  Enabled: false
Style/TrivialAccessors:
  # def x = @x and attr_reader differ in arity, writers and the prelude's Go bodies
  Enabled: false

# Cops with no autocorrect whose offenses are constructs the fixtures, prelude, benchmarks and boot
# hooks exercise on purpose (global vars, `a == a`, rescue Exception, Struct.new overrides, ...).
# New code under scripts/ and cmd/ is still checked.
Lint/BinaryOperatorWithIdenticalOperands: &fixtures
  Exclude:
    - testdata/**/*
    - examples/**/*
    - prelude/**/*
    - prelude.rb
    - benchmarks/**/*
    - internal/boot/**/*
Lint/ConstantDefinitionInBlock: *fixtures
Lint/DuplicateElsifCondition: *fixtures
Lint/DuplicateMethods: *fixtures
Lint/EmptyConditionalBody: *fixtures
Lint/EmptyExpression: *fixtures
Lint/EmptyWhen: *fixtures
Lint/EnsureReturn: *fixtures
Lint/FloatComparison: *fixtures
Lint/FormatParameterMismatch: *fixtures
Lint/IneffectiveAccessModifier: *fixtures
Lint/LiteralAsCondition: *fixtures
Lint/MissingSuper: *fixtures
Lint/MixedRegexpCaptureTypes: *fixtures
Lint/NonLocalExitFromIterator: *fixtures
Lint/RandOne: *fixtures
Lint/RescueException: *fixtures
Lint/ReturnInVoidContext: *fixtures
Lint/ShadowedException: *fixtures
Lint/StructNewOverride: *fixtures
Lint/SuppressedException: *fixtures
Lint/UnderscorePrefixedVariableName: *fixtures
Lint/UnreachableCode: *fixtures
Lint/UnreachableLoop: *fixtures
Lint/UnusedMethodArgument: *fixtures
Naming/AccessorMethodName: *fixtures
Naming/AsciiIdentifiers: *fixtures
Naming/ClassAndModuleCamelCase: *fixtures
Naming/ConstantName: *fixtures
Naming/HeredocDelimiterNaming: *fixtures
Naming/MethodName: *fixtures
Naming/PredicatePrefix: *fixtures
Naming/VariableName: *fixtures
Naming/VariableNumber: *fixtures
Security/MarshalLoad: *fixtures
Security/Open: *fixtures
Style/BeginBlock: *fixtures
Style/CaseEquality: *fixtures
Style/ClassVars: *fixtures
Style/ExponentialNotation: *fixtures
Style/FormatStringToken: *fixtures
Style/GlobalVars: *fixtures
Style/MissingRespondToMissing: *fixtures
Style/MixinUsage: *fixtures
Style/MultilineBlockChain: *fixtures
Style/OptionalArguments: *fixtures
Style/OptionalBooleanParameter: *fixtures

# Style opinions that do not fit: short parameter names (a, b, io) are idiomatic, `%s` is fine in
# format strings, and the scripts/hooks use globals and class variables on purpose.
Naming/MethodParameterName:
  Enabled: false
Style/FormatStringToken:
  Enabled: false
Style/ClassVars:
  Enabled: false
Style/OptionalBooleanParameter:
  Enabled: false
Style/GlobalVars:
  Enabled: false
Style/MultilineBlockChain:
  Enabled: false
Style/StringConcatenation:
  # tests exercise String#+ and << chains; the prelude builds Go text with +
  Enabled: false
Style/SpecialGlobalVars:
  # tests exercise $! $~ $0 and friends by their short names
  Enabled: false
Style/InfiniteLoop:
  # tests exercise while true / until false
  Enabled: false
Style/NumericPredicate:
  # tests exercise == 0 / > 0 comparisons themselves
  Enabled: false
Lint/Loop:
  # tests exercise begin...end while
  Enabled: false
Style/For:
  # tests exercise for loops
  Enabled: false
Style/YodaCondition:
  # tests exercise literal-first comparisons
  Enabled: false
Style/DoubleNegation:
  # tests exercise !!x
  Enabled: false
Naming/MemoizedInstanceVariableName:
  # fixtures memoize under their own ivar names
  Enabled: false
Style/ClassAndModuleChildren:
  # tests exercise class A::B compact definitions
  Enabled: false
Style/GlobalStdStream:
  # tests exercise STDOUT/STDERR constants
  Enabled: false
Lint/InheritException:
  # tests exercise subclassing Exception
  Enabled: false
Style/HashEachMethods:
  # tests exercise each_pair/keys.each forms
  Enabled: false
Lint/BooleanSymbol:
  # tests exercise :true and :false
  Enabled: false
Lint/InterpolationCheck:
  # tests exercise single-quoted #{} text
  Enabled: false
Style/MutableConstant:
  # tests and the prelude rely on unfrozen constants (Go bodies mutate them)
  Enabled: false
Style/RedundantInterpolation:
  # tests exercise "#{x}" for to_s coercion
  Enabled: false
Style/CombinableLoops:
  # tests exercise consecutive loops over one collection
  Enabled: false
Style/SymbolProc:
  # tests exercise explicit block forms against &:sym
  Enabled: false
Style/FormatString:
  # tests exercise format, sprintf and String#% alike
  Enabled: false
Style/PercentLiteralDelimiters:
  # the prelude's %x{} Go bodies use braces; other delimiters break on unbalanced Go text
  Enabled: false
Lint/RedundantCopDisableDirective:
  # fixtures carry disable comments for cops this config excludes them from
  Enabled: false
Layout/ElseAlignment:
  Exclude:
    # an `if` expression inside "#{}" interpolation; the generated-looking layout is the example's output shape
    - examples/135_roundhouse_blog/blog/app/views/articles/_form.rb
